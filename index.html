<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bored</title>

  <style>
    body {
      font-family: system-ui, Arial, sans-serif;
      padding: 24px;
      max-width: 720px;
      margin: 0 auto;
    }

    .card {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 18px;
    }

    h1 {
      font-size: 18px;
      margin: 0 0 12px;
    }

    p {
      font-size: 22px;
      line-height: 1.35;
      margin: 0 0 16px;
    }

    button {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #ccc;
      background: #fff;
      cursor: pointer;
    }

    .fade {
      opacity: 0;
      transition: opacity 250ms ease-in;
    }

    .fade.show {
      opacity: 1;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Bored?  
Read this...</h1>

    <img
      id="pic"
      class="fade"
      style="max-width:100%; height:auto; border-radius:12px; margin-bottom:14px;"
      alt="Random image"
    />

    <p id="sentence" class="fade">Loading…</p>

    <button id="again" type="button">Show another</button>
  </div>

<script>
  let sentences = [];
  let images = [];
  let sentencesLoaded = false;
  let imagesLoaded = false;

  fetch("sentences.txt")
    .then(r => r.text())
    .then(text => {
      sentences = text
        .split("\n")
        .map(l => l.trim())
        .filter(Boolean);
      sentencesLoaded = true;
      tryStart();
    })
    .catch(() => {
      sentences = ["Error loading sentences."];
      sentencesLoaded = true;
      tryStart();
    });

  fetch("images.json")
    .then(r => r.json())
    .then(list => {
      images = list;
      imagesLoaded = true;
      tryStart();
    })
    .catch(() => {
      images = [];
      imagesLoaded = true;
      tryStart();
    });

  function tryStart() {
    if (sentencesLoaded && imagesLoaded) {
      showRandom();
    }
  }

  function getLastIndex(key) {
    const n = Number(localStorage.getItem(key));
    return Number.isInteger(n) ? n : -1;
  }

  function setLastIndex(key, index) {
    localStorage.setItem(key, String(index));
  }

  function randomIndex(length, lastIndex) {
    if (length <= 1) return 0;
    let i;
    do {
      i = Math.floor(Math.random() * length);
    } while (i === lastIndex);
    return i;
  }

  function fadeIn(el) {
    el.classList.remove("show");
    void el.offsetWidth;
    requestAnimationFrame(() => el.classList.add("show"));
  }

  function showRandom() {
    if (!sentences.length && !images.length) return;

    // 75% sentence, 25% image
    const showSentence = Math.random() < 0.75;

    const sentenceEl = document.getElementById("sentence");
    const imgEl = document.getElementById("pic");

    // Hide both first
    sentenceEl.style.display = "none";
    imgEl.style.display = "none";

    if (showSentence && sentences.length) {
      const sIndex = randomIndex(
        sentences.length,
        getLastIndex("lastSentenceIndex")
      );
      setLastIndex("lastSentenceIndex", sIndex);

      sentenceEl.textContent = sentences[sIndex];
      sentenceEl.style.display = "block";
      fadeIn(sentenceEl);
    } else if (images.length) {
      const iIndex = randomIndex(
        images.length,
        getLastIndex("lastImageIndex")
      );
      setLastIndex("lastImageIndex", iIndex);

      imgEl.classList.remove("show");
      imgEl.onload = () => fadeIn(imgEl);
      imgEl.onerror = () => fadeIn(imgEl);
      imgEl.src = images[iIndex];
      imgEl.style.display = "block";
    }
  }

  document.getElementById("again").addEventListener("click", showRandom);
</script>


</body>
</html>
